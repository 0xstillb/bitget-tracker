name: Security gate

on:
  pull_request:
    branches: [integration]
  push:
    branches: [integration]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run tests
        run: python -m pytest tests -q
      - name: Run repository security invariants
        run: python tools/security_gate.py

  node-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: headless/package-lock.json
      - name: Install locked Node dependencies without lifecycle scripts
        working-directory: headless
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reject high-severity production dependency advisories
        working-directory: headless
        run: npm audit --omit=dev --audit-level=high
      - name: Validate login worker syntax
        run: node --check headless/login-worker.js
