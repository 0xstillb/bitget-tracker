[platformio]
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
  bodmer/TFT_eSPI @ ^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  lvgl/lvgl @ ^8.3.11
build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_CONF_SKIP
  -D USER_SETUP_LOADED
  -include User_Setup.h
