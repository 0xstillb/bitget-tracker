<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Copy Bitget session</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { background: #101826; color: #edf3ff; margin: 0; width: 320px; }
      main { padding: 18px; }
      h1 { font-size: 16px; margin: 0 0 10px; }
      p { color: #b9c7da; font-size: 13px; line-height: 1.45; margin: 0 0 14px; }
      button { background: #2d77ff; border: 0; border-radius: 8px; color: #fff; cursor: pointer; font-weight: 650; padding: 10px 12px; width: 100%; }
      button:disabled { cursor: wait; opacity: .65; }
      #status { font-size: 12px; margin-top: 12px; min-height: 18px; }
      .ok { color: #71e3a3; }
      .error { color: #ff9999; }
      .note { border-top: 1px solid #28374e; color: #8da0ba; font-size: 11px; margin-top: 16px; padding-top: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Copy Bitget session</h1>
      <p>Sign in to Bitget first. This copies your active Bitget cookie header only when you press the button.</p>
      <button id="copy-session" type="button">Copy session to clipboard</button>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="note">Nothing is saved, uploaded, or sent over the network. Treat clipboard contents like a password.</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
